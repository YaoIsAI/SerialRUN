plugins {
    id 'com.android.application'
}

android {
    namespace 'com.serialrun.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.serialrun.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.2'
}
